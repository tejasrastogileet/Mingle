# Load backend-local settings from Backend/meetnow/.env when running from the
# backend project directory. OS environment variables still take precedence.
spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties

# There is intentionally no localhost fallback: configure MONGODB_URI in .env
# or the process environment so a missing Atlas configuration fails at startup.
spring.data.mongodb.uri=${MONGODB_URI}

# ========================
# Server Configuration
# ========================
server.port=${PORT:8080}
server.servlet.context-path=/api/v1.0

# ========================
# JWT Configuration
# ========================
jwt.secret.key=${JWT_SECRET_KEY}

# ========================
# Cross-Origin Configuration
# ========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ========================
# Agora RTC Credentials
# ========================
agora.app.id=${AGORA_APP_ID:}
agora.app.certificate=${AGORA_APP_CERTIFICATE:}
